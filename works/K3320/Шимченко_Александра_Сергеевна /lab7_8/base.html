<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Весёлые Крабы{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #87ceeb, #ffffff);
            min-height: 100vh;
            position: relative;
            padding-bottom: 60px;
        }
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #f76c6c;
            color: white;
            text-align: center;
            line-height: 60px;
        }
        header {
            background-color: #ffb347;
            padding: 20px;
            text-align: center;
        }
        nav a {
            margin: 0 10px;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>🦀 Весёлые Крабы</h1>
    <nav>
        <a class="btn btn-danger" href="{% url 'home' %}">Главная</a>
        <a class="btn btn-warning" href="{% url 'about' %}">О разработке</a>
        <a class="btn btn-info" href="{% url 'contact' %}">Обратная связь</a>
    </nav>
</header>

<main class="container mt-5">
    {% block content %}{% endblock %}
</main>

<footer>
    Весёлые Крабы. Автор - Шимченко А.С.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
