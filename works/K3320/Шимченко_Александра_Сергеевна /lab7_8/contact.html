{% extends 'main/base.html' %}

{% block title %}Обратная связь{% endblock %}

{% block content %}
<div class="text-center">
    <h2>Свяжитесь с нами!</h2>
</div>

<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors|striptags }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-success">Отправить крабам!</button>
</form>
{% endblock %}
